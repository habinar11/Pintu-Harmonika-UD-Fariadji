<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ovenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0714"/>
      <stop offset="50%" stop-color="#1e050a"/>
      <stop offset="100%" stop-color="#0a0204"/>
    </linearGradient>
    <linearGradient id="sprayGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#ovenGrad)"/>

  <!-- Workshop Duco Chamber Frame -->
  <rect x="50" y="40" width="700" height="520" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
  <rect x="70" y="60" width="660" height="480" rx="14" fill="#09090b"/>

  <!-- Overhead Heating Lamps -->
  <circle cx="200" cy="90" r="28" fill="#f59e0b" opacity="0.3"/>
  <circle cx="400" cy="90" r="28" fill="#f59e0b" opacity="0.3"/>
  <circle cx="600" cy="90" r="28" fill="#f59e0b" opacity="0.3"/>
  <circle cx="200" cy="90" r="14" fill="#fef08a"/>
  <circle cx="400" cy="90" r="14" fill="#fef08a"/>
  <circle cx="600" cy="90" r="14" fill="#fef08a"/>

  <!-- High Gloss Painted Folding Gate Panels -->
  <g stroke="#9f1239" stroke-width="2">
    <rect x="100" y="140" width="70" height="370" fill="url(#sprayGloss)"/>
    <rect x="180" y="140" width="70" height="370" fill="url(#sprayGloss)"/>
    <rect x="260" y="140" width="70" height="370" fill="url(#sprayGloss)"/>
    <rect x="340" y="140" width="70" height="370" fill="url(#sprayGloss)"/>
    <rect x="420" y="140" width="70" height="370" fill="url(#sprayGloss)"/>
    <rect x="500" y="140" width="70" height="370" fill="url(#sprayGloss)"/>
    <rect x="580" y="140" width="70" height="370" fill="url(#sprayGloss)"/>
  </g>

  <!-- Specular Reflection Sheen (Gloss Finish) -->
  <polygon points="100,140 250,140 180,510 100,510" fill="#ffffff" opacity="0.12"/>
  <polygon points="340,140 480,140 420,510 340,510" fill="#ffffff" opacity="0.08"/>

  <!-- Cross Lattice Behind Slats -->
  <g stroke="url(#goldPlate)" stroke-width="3" opacity="0.85">
    <line x1="100" y1="200" x2="250" y2="300"/>
    <line x1="250" y1="200" x2="100" y2="300"/>
    <line x1="260" y1="200" x2="410" y2="300"/>
    <line x1="410" y1="200" x2="260" y2="300"/>
    <line x1="420" y1="200" x2="570" y2="300"/>
    <line x1="570" y1="200" x2="420" y2="300"/>

    <line x1="100" y1="350" x2="250" y2="450"/>
    <line x1="250" y1="350" x2="100" y2="450"/>
    <line x1="260" y1="350" x2="410" y2="450"/>
    <line x1="410" y1="350" x2="260" y2="450"/>
    <line x1="420" y1="350" x2="570" y2="450"/>
    <line x1="570" y1="350" x2="420" y2="450"/>
  </g>

  <!-- Quality Stamp -->
  <g transform="translate(620, 480)">
    <circle cx="40" cy="0" r="34" fill="#881337" stroke="#fcd34d" stroke-width="2"/>
    <text x="40" y="-4" text-anchor="middle" fill="#fef08a" font-size="11" font-weight="900" font-family="sans-serif">DUCO</text>
    <text x="40" y="10" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif">OVEN</text>
  </g>
</svg>
